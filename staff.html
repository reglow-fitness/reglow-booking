<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Re:GLOW FITNESS スタッフ申請</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif; background: #f0f0f0; color: #111; max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 40px; }
  .header { background: #222; padding: 16px; position: sticky; top: 0; z-index: 100; }
  .header-title { color: white; font-size: 15px; font-weight: 600; }
  .header-sub { color: #aaa; font-size: 12px; margin-top: 2px; }
  .screen { display: none; padding: 14px; }
  .screen.active { display: block; }
  .loading { text-align: center; color: #aaa; font-size: 13px; padding: 30px 0; }
  .card { background: white; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .card-title { font-size: 13px; font-weight: 600; color: #555; margin-bottom: 10px; }
  .form-label { font-size: 12px; color: #888; display: block; margin-bottom: 6px; }
  .form-input { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 12px; background: white; }
  .btn { display: block; width: 100%; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
  .btn-primary { background: #222; color: white; }
  .cat-buttons { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; }
  .cat-btn { padding: 14px 4px; border-radius: 8px; border: 1.5px solid #ddd; background: white; font-size: 14px; font-weight: 700; cursor: pointer; text-align: center; }
  .cat-btn:active { transform: scale(0.96); }
  .cat-btn.c1 { border-color: #06C755; color: #06C755; }
  .cat-btn.c2 { border-color: #2f80ed; color: #2f80ed; }
  .cat-btn.c3 { border-color: #9b51e0; color: #9b51e0; }
  .cat-btn.c0 { border-color: #999; color: #999; }
  .section-label { font-size: 12px; color: #aaa; font-weight: 600; margin: 18px 0 8px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #222; color: white; padding: 10px 18px; border-radius: 99px; font-size: 13px; z-index: 999; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .history-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
  .history-time { font-size: 14px; font-weight: 700; width: 60px; }
  .history-cat { font-size: 13px; font-weight: 600; flex: 1; }
  .history-cat.c1 { color: #06C755; } .history-cat.c2 { color: #2f80ed; } .history-cat.c3 { color: #9b51e0; } .history-cat.c0 { color: #999; }
  .history-del { color: #e74c3c; font-size: 12px; font-weight: 600; padding: 6px 10px; cursor: pointer; }
  .total-row { display: flex; justify-content: space-between; padding-top: 10px; margin-top: 6px; border-top: 2px solid #eee; font-size: 13px; font-weight: 700; }
  .day-card { background: white; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
  .day-card-title { font-size: 13px; font-weight: 700; color: #222; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: baseline; }
  .day-card-title .day-count { font-size: 11px; font-weight: 600; color: #aaa; }
  .day-card .history-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title" id="header-staff-name">Re:GLOW FITNESS スタッフ申請</div>
  <div class="header-sub" id="header-date"></div>
</div>

<div class="screen active" id="screen-loading">
  <div class="loading">読み込み中...</div>
</div>

<!-- 初回：本人紐付け -->
<div class="screen" id="screen-link">
  <div class="card">
    <div class="card-title">初回登録</div>
    <label class="form-label">お名前を選択してください</label>
    <select class="form-input" id="link-staff-select"></select>
    <label class="form-label">PINコード（4桁）</label>
    <input class="form-input" id="link-pin-input" maxlength="4" inputmode="numeric" placeholder="1234">
    <button class="btn btn-primary" onclick="doLink()">連携する</button>
    <p style="font-size:11px;color:#aaa;margin-top:10px;">PINが分からない場合はオーナーに確認してください。一度連携すれば次回からこの画面は表示されません。</p>
  </div>
</div>

<!-- メイン画面 -->
<div class="screen" id="screen-main">
  <div class="card">
    <div class="card-title">申請を追加</div>
    <label class="form-label">対象日</label>
    <input class="form-input" type="date" id="entry-date">
    <label class="form-label">時間</label>
    <select class="form-input" id="entry-time"></select>
    <label class="form-label">対応人数（タップで即申請）</label>
    <div class="cat-buttons" id="entry-cat-buttons"></div>
  </div>

  <div class="section-label">申請履歴</div>
  <div id="history-list"><div class="loading">読み込み中...</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://plapbyvgthymszrzbsgl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-FVZ_yzggmRe8cTv4oGXJg_4zqIZEIc';
const LIFF_ID = '2009580897-rRhB0wbR';

const CATEGORY_LABELS = {1:'1人',2:'2人',3:'3人',0:'なし'};
const CATEGORY_CLASS = {1:'c1',2:'c2',3:'c3',0:'c0'};

let sbClient = null;
let lineProfile = null;
let currentStaff = null;
let historyEntries = [];

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function showScreen(name){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+name).classList.add('active');}

function buildTimeOptions(){
  const sel = document.getElementById('entry-time');
  let html = '';
  for(let h=7; h<=22; h++){
    const hh = String(h).padStart(2,'0');
    html += `<option value="${hh}:00">${hh}時</option>`;
  }
  sel.innerHTML = html;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,'0');
  const target = `${hh}:00`;
  if([...sel.options].some(o=>o.value===target)) sel.value = target;
}

async function init(){
  sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const dn=['日','月','火','水','木','金','土'];
  const d=new Date();
  document.getElementById('header-date').textContent=`${d.getMonth()+1}月${d.getDate()}日（${dn[d.getDay()]}）`;
  document.getElementById('entry-date').value=todayStr();
  buildTimeOptions();
  renderCatButtons();
  try{
    await liff.init({ liffId: LIFF_ID });
    if(liff.isLoggedIn()){
      lineProfile = await liff.getProfile();
    } else {
      liff.login();
      return;
    }
  }catch(e){
    document.getElementById('screen-loading').innerHTML='<div class="loading">このページはLINEアプリ内でご利用ください。</div>';
    return;
  }
  const {data} = await sbClient.from('staff').select('*').eq('line_user_id', lineProfile.userId).eq('is_active', true).maybeSingle();
  if(data){
    currentStaff = data;
    document.getElementById('header-staff-name').textContent = `${currentStaff.name} さん`;
    showScreen('main');
    await loadHistory();
  } else {
    await prepareLinkScreen();
    showScreen('link');
  }
}

async function prepareLinkScreen(){
  const {data} = await sbClient.from('staff').select('*').eq('is_active', true).is('line_user_id', null).order('name');
  const sel = document.getElementById('link-staff-select');
  sel.innerHTML = (data||[]).map(s=>`<option value="${s.id}">${s.name}</option>`).join('') || '<option value="">対象スタッフがいません（オーナーに連絡してください）</option>';
}

async function doLink(){
  const staffId = document.getElementById('link-staff-select').value;
  const pin = document.getElementById('link-pin-input').value.trim();
  if(!staffId){toast('スタッフを選択してください');return;}
  const {data:staff} = await sbClient.from('staff').select('*').eq('id',staffId).single();
  if(!staff || staff.pin_code !== pin){toast('PINが違います');return;}
  const {error} = await sbClient.from('staff').update({line_user_id: lineProfile.userId}).eq('id', staffId);
  if(error){toast('連携に失敗しました');return;}
  currentStaff = {...staff, line_user_id: lineProfile.userId};
  document.getElementById('header-staff-name').textContent = `${currentStaff.name} さん`;
  showScreen('main');
  await loadHistory();
}

function renderCatButtons(){
  const el = document.getElementById('entry-cat-buttons');
  el.innerHTML = [1,2,3,0].map(c=>`<div class="cat-btn ${CATEGORY_CLASS[c]}" onclick="submitEntry(${c})">${CATEGORY_LABELS[c]}</div>`).join('');
}

async function submitEntry(category){
  const date = document.getElementById('entry-date').value;
  const time = document.getElementById('entry-time').value;
  if(!date||!time){toast('日付と時間を選択してください');return;}
  const sessionTime = new Date(`${date}T${time}:00`).toISOString();
  const {error} = await sbClient.from('session_reports').insert({staff_id: currentStaff.id, report_date: date, session_time: sessionTime, category, report_mode: 'single', booking_ids: []});
  if(error){toast('送信に失敗しました');return;}
  toast(`${time} ${CATEGORY_LABELS[category]}対応で申請しました`);
  await loadHistory();
}

async function loadHistory(){
  const {data} = await sbClient.from('session_reports').select('*').eq('staff_id', currentStaff.id).order('report_date',{ascending:false}).order('session_time',{ascending:false}).limit(30);
  historyEntries = data || [];
  renderHistory();
}

function renderHistory(){
  const el = document.getElementById('history-list');
  if(!historyEntries.length){el.innerHTML='<div class="loading">まだ申請がありません</div>';return;}
  const byDate = {};
  const order = [];
  for(const r of historyEntries){
    if(!byDate[r.report_date]){byDate[r.report_date]=[];order.push(r.report_date);}
    byDate[r.report_date].push(r);
  }
  let html = '';
  for(const date of order){
    const rows = byDate[date];
    const [y,m,d] = date.split('-');
    const isToday = date === todayStr();
    html += `<div class="day-card">
      <div class="day-card-title"><span>${m}月${d}日${isToday?'（本日）':''}</span><span class="day-count">${rows.length}件</span></div>
      ${rows.map(r=>{
        const timeStr = r.session_time ? new Date(r.session_time).toTimeString().slice(0,5) : '—';
        return `<div class="history-row">
          <div class="history-time">${timeStr}</div>
          <div class="history-cat ${CATEGORY_CLASS[r.category]}">${CATEGORY_LABELS[r.category]}対応</div>
          <div class="history-del" onclick="deleteEntry('${r.id}')">取消</div>
        </div>`;
      }).join('')}
    </div>`;
  }
  el.innerHTML = html;
}

async function deleteEntry(id){
  if(!confirm('この申請を取り消しますか？')) return;
  const {error} = await sbClient.from('session_reports').delete().eq('id', id);
  if(error){toast('取り消しに失敗しました');return;}
  toast('取り消しました');
  await loadHistory();
}

init();
</script>
</body>
</html>
